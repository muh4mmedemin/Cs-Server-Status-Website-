<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunucu Durumu</title>
  <meta name="description" content="Oyun sunucularının anlık durumu (GameTracker).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;600&family=Rajdhani:wght@500;700&family=VT323&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="club42">
  <!-- Sol: oyun geçiş çubuğu -->
  <nav class="game-rail" id="game-rail" aria-label="Oyunlar"></nav>
  <div class="fade-veil" aria-hidden="true"></div>

  <div class="desktop">
    <!-- 42 KULÜP ANA SAYFASI -->
    <main class="club-home" id="club-home" hidden>
      <header class="home-hero">
        <div class="home-logo" aria-hidden="true">42</div>
        <div class="home-intro">
          <h1 class="home-title" id="club-name"></h1>
          <p class="home-about" id="club-about"></p>
          <div class="home-actions" id="club-links">
            <button class="home-btn" id="home-console" type="button">&gt;_ Konsol</button>
          </div>
        </div>
      </header>

      <section class="home-games">
        <h2 class="home-section"><span>$</span> ls sunucular/</h2>
        <div class="game-cards" id="club-servers"></div>
      </section>

      <section class="home-works" id="home-works" hidden>
        <h2 class="home-section"><span>$</span> ls yapimlar/</h2>
        <div class="work-cards" id="home-works-list"></div>
      </section>
    </main>

    <main class="vgui-window" id="server-window" hidden>
      <div class="title-bar">
        <span class="title" id="window-title" lang="en"></span>
        <span class="title-buttons">
          <span class="tbtn" aria-hidden="true">_</span>
          <span class="tbtn" aria-hidden="true">x</span>
        </span>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="status" role="tab">Durum</button>
        <button class="tab" data-tab="rules" role="tab">Kurallar</button>
        <button class="tab" data-tab="works" role="tab">Yapımlar</button>
        <button class="tab" data-tab="howto" role="tab">Nasıl Bağlanırım?</button>
        <button class="tab" id="tab-console" type="button">Konsol</button>
      </div>

      <div class="panel">
        <!-- DURUM -->
        <section class="tab-content active" id="tab-status">
          <div class="group">
            <div class="group-label">GameTracker &ndash; Anlık Durum</div>
            <div class="banner-wrap">
              <a id="gt-link" href="#" target="_blank" rel="noopener">
                <img id="gt-banner" width="560" height="95" alt="GameTracker sunucu banner'ı">
              </a>
              <div class="banner-error" id="gt-error" hidden></div>
            </div>
          </div>

          <div class="group">
            <div class="group-label">Sunucu</div>
            <table class="server-list">
              <thead>
                <tr>
                  <th>Adres</th>
                  <th>Oyun</th>
                  <th>Kaynak</th>
                </tr>
              </thead>
              <tbody>
                <tr class="selected">
                  <td class="js-address"></td>
                  <td id="game-name"></td>
                  <td><a id="gt-url" href="#" target="_blank" rel="noopener">GameTracker</a></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="refresh-row">
            <span class="refresh-label">Sonraki yenileme: <b id="countdown">--</b> sn</span>
            <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
          </div>

          <div class="button-row">
            <a class="vbtn primary" id="btn-connect" href="#">Bağlan</a>
            <button class="vbtn" id="btn-copy">IP Kopyala</button>
            <button class="vbtn" id="btn-refresh">Yenile</button>
          </div>
        </section>

        <!-- KURALLAR -->
        <section class="tab-content" id="tab-rules">
          <div class="group">
            <div class="group-label">Sunucu Kuralları</div>
            <ol class="rules" id="rules-list"></ol>
          </div>
        </section>

        <!-- YAPIMLAR -->
        <section class="tab-content" id="tab-works">
          <div class="work-cards" id="works-list"></div>
          <p class="works-empty" id="works-empty">Bu oyun için henüz yapım eklenmedi.</p>
        </section>

        <!-- NASIL BAĞLANIRIM -->
        <section class="tab-content" id="tab-howto">
          <div class="group">
            <div class="group-label">Bağlanma Yolları</div>
            <ol class="rules howto" id="howto-list"></ol>
          </div>
        </section>
      </div>
    </main>

    <!-- Konsol penceresi -->
    <section class="vgui-window console-window" id="console-window" hidden>
      <div class="title-bar">
        <span class="title">Konsol</span>
        <span class="title-buttons">
          <button class="tbtn" id="console-close" aria-label="Kapat">x</button>
        </span>
      </div>
      <div class="panel">
        <pre class="console-log" id="console-log"></pre>
        <form class="console-input" id="console-form" autocomplete="off">
          <input type="text" id="console-cmd" placeholder="help yazın...">
          <button class="vbtn" type="submit">Gönder</button>
        </form>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
